[package]
name = "laravel-rust-encryption"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port of Laravel's Illuminate\\Encryption\\Encrypter, wire-compatible with Laravel 10 through 13"
license = "MIT"
authors = ["René Roscher <roscher794@gmail.com>"]
repository = "https://github.com/Rene-Roscher/laravel-rust-encryption"
homepage = "https://github.com/Rene-Roscher/laravel-rust-encryption"
documentation = "https://docs.rs/laravel-rust-encryption"
readme = "README.md"
keywords = ["laravel", "encryption", "aes", "crypt", "php"]
categories = ["cryptography"]
include = ["src/**", "tests/**", "examples/**", "fixtures/**", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.3"
hmac = "0.12"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
